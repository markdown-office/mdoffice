# The key and the organisation have to match a project that already exists, or the
# scan is refused with "not authorized or project not found" — which reads like a token
# problem and is not one. The project is created from the repository, not from this
# file, and the organisation is bound at that point: neither can be changed afterwards
# short of creating the project again.
sonar.projectKey=markdown-office_mdoffice
sonar.organization=markdown-office

# `tools/build-phar.php` is analysed as source, and it is the largest file here: it
# shells out to Composer and to a PHP binary. `sonar.tests` is `tests` and not `tools`
# as well — a file cannot be in both sets, and the scanner refuses the whole analysis
# when one is: "File tools/build-phar.php can't be indexed twice."
sonar.sources=src,bin,tools/build-phar.php
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# "New" means changed since `main`. Unset, it means changed since the last *version*,
# which this project does not cut on every merge, so the gate would turn on when a
# release happened rather than on what the pull request did.
sonar.newCode.referenceBranch=main

sonar.exclusions=\
    build/**,\
    dist/**,\
    vendor/**,\
    tmp/**,\
    .phpunit.cache/**

# The version the code has to *run* on, not the one CI happens to use: higher would let
# through syntax the minimum-version job then rejects.
sonar.php.version=8.2

# Both written by the analysis job, which runs the suite once for both.
sonar.php.coverage.reportPaths=build/coverage/clover.xml
sonar.junit.reportPaths=build/coverage/junit.xml

# A statement about this program, so measured over it. The tests are still analysed —
# that is where a duplication finding shows up first — but a pull request that adds
# tests would otherwise dilute its own coverage with lines no report describes.
sonar.coverage.exclusions=examples/**,tests/**,tools/**

