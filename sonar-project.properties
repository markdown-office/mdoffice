# SonarCloud configuration.
#
# Kept as a file rather than as arguments on the scan step, so the analysis says the
# same thing whichever machine runs it and so that what gets analysed is visible to
# anyone reading the repository rather than buried in a workflow.
#
# The token is never in here. It comes from the SONAR_TOKEN repository secret.
#
# These two have to match, or the scan is refused with "not authorized or project not
# found" — which reads like a token problem and is not one. After a re-import they are
# also a thing that must exist before this is pushed: the project is created from the
# repository, not from this file.
#
# These two were `fabeat` before the repository moved to this organisation, and the
# project is re-imported rather than renamed for the same reason markdown-word's is:
# a bound organisation cannot be re-pointed, so the only way to change it is to create
# the project again.
sonar.projectKey=markdown-office_mdoffice
sonar.organization=markdown-office

# The program is what is analysed; the tests are read so that coverage and duplication
# are judged against them.
#
# `tools/build-phar.php` is analysed, and it is the largest file in the repository: it
# resolves dependencies, assembles an archive and then runs the archive it wrote. It
# shells out to Composer and to a PHP binary, which is most of what makes a finding in
# it worth having, so leaving it out would analyse a fraction of the repository.
#
# `examples/` is not analysed. They are documents to be read and converted, and nothing
# here decides whether they are right.
sonar.sources=src,bin,tools/build-phar.php
sonar.tests=tests,tools
sonar.sourceEncoding=UTF-8

# What "new" means, and it is not the same thing as "recent". Left unset, SonarCloud
# counts a line as new when it changed since the *previous version*, which this project
# does not cut on every merge — so a pull request would be measured against a baseline
# that moves when a release happens rather than when the code does, and the gate would
# pass or fail for reasons nobody reading the diff could see.
#
# Naming `main` measures the gate on what the pull request actually changes, which is
# what the analysis job above says it does when it asks for the full history. Without
# it that history is fetched for nothing.
sonar.newCode.referenceBranch=main

# Everything a build produces rather than anything authored.
sonar.exclusions=\
    build/**,\
    dist/**,\
    vendor/**,\
    tmp/**,\
    .phpunit.cache/**

# The version the code has to *run* on, which is not the version CI happens to run on.
# It is what the analysis is judged against, so setting it higher would let syntax in
# that the minimum-version job then rejects.
sonar.php.version=8.2

# Both reports are written by the analysis job, which runs the suite once for coverage
# and for the test results together.
sonar.php.coverage.reportPaths=build/coverage/clover.xml
sonar.junit.reportPaths=build/coverage/junit.xml

# Coverage is a statement about this program, so it is measured over it.
#
# The tests are still analysed — they are where a duplication finding would show up
# first, and it would be odd to stop looking there — but they are kept out of the
# coverage figure. A pull request that adds tests would otherwise dilute its own
# coverage with lines that no coverage report describes, which is a gate that punishes
# writing tests.
sonar.coverage.exclusions=examples/**,tests/**,tools/**

# `githubactions:S8546` reports `composer update` as an unpinned dependency
# installation. There is no lock file to pin against and there cannot be one: the
# manifest resolves both libraries through `path` repositories, so a lock would record
# whichever branches those two checkouts happened to be on rather than anything this
# repository chose — the one that was committed recorded a branch that existed on the
# machine that wrote it. `tools/build-phar.php` already stages the manifest with the two
# rewritten as `vcs` and resolves from that for the same reason.
#
# `markdown-word` commits a lock and does not need this: it requires nothing by
# directory, so a lock there records released versions rather than local branches. It
# is the path entries, not being an application, that make one useless here.
#
# So the rule is suppressed for the one file that installs, and for this rule alone, so
# that a `composer install` added anywhere else is still reported — that would be a
# different mistake with the same wording.
#
# What would resolve it rather than silence it: registering `markdown-office/*` on
# Packagist. The requirements could then name released versions, the `path`
# repositories could go, and a lock would pin what a released archive holds.
sonar.issue.ignore.multicriteria=unlocked-library-deps
sonar.issue.ignore.multicriteria.unlocked-library-deps.ruleKey=githubactions:S8546
sonar.issue.ignore.multicriteria.unlocked-library-deps.resourceKey=**/action.yml
