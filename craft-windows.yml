# static-php-cli's build configuration for the Windows executable.
#
# Windows is the only platform this repository compiles. Upstream publishes a
# `micro` build for Linux and for macOS and none for Windows, so the other three
# platforms take what upstream publishes — pinned by its checksum — and this one
# is built here, by the tool at a pinned commit.
#
# `imagick` is absent from the extension list because static-php-cli cannot build
# it on Windows: ImageMagick's own Windows build uses a 64-channel bit mask that
# needs a C++ compiler, and the upstream tool does not patch that. A Windows
# binary therefore has no SVG support, and both libraries say so with an
# actionable message rather than failing quietly. The pipeline asserts the
# absence on purpose, so a build that silently gained it would be noticed.
#
# `tests/Unit/craft.php` holds this file and fails when it stops carrying what
# the libraries ask for.

php-version: '8.4'

extensions: "dom,simplexml,xml,xmlwriter,gd,zip,mbstring,phar,iconv,tokenizer,filter,ctype"

sapi:
  - micro

build-options:
  # The graphics libraries `gd` is built against. Without them the extension has no
  # JPEG support at all — the functions are not even compiled in — so a build that
  # passes `composer check-platform-reqs` would still refuse a photograph.
  with-libs: "freetype,libjpeg,libavif,libwebp"
  # The executable is not packed. PHP's own Windows build links with `/GUARD:CF`,
  # and UPX refuses to pack a PE file that has Control Flow Guard enabled: it
  # would have to rewrite the guard's tables, and the guard is what the build
  # gets for free from PHP. Packing it with `--force` works and drops the guard,
  # so the file is left as it is built — with the mitigation, and with a size a
  # user waits for once.
  with-upx-pack: false

download-options:
  prefer-binary: true
