# static-php-cli's build configuration for the Windows executable.
#
# The same build as `craft-macos.yml` and `craft-linux.yml`, differing in exactly
# two places, both of which `craft-macos.yml` explains: `imagick` is absent from the
# extension list because static-php-cli cannot build it on Windows, and
# `with-upx-pack` is set because UPX does not support Mach-O and does support this.
#
# A Windows binary therefore has no SVG support, and both libraries say so with an
# actionable message rather than failing quietly. The pipeline asserts the absence
# on purpose, so a build that silently gained it would be noticed.
#
# `tests/Unit/craft.php` holds the three side by side and fails when a difference
# appears that is not one of the two.

php-version: '8.4'

extensions: "dom,simplexml,xml,xmlwriter,gd,zip,mbstring,phar,iconv,tokenizer,filter,ctype"

sapi:
  - cli
  - micro

build-options:
  # The graphics libraries `gd` is built against. Without them the extension has no
  # JPEG support at all — the functions are not even compiled in — so a build that
  # passes `composer check-platform-reqs` would still refuse a photograph.
  with-libs: "freetype,libjpeg,libavif,libwebp"
  # 30–50% smaller. The tool is downloaded rather than installed, so the size is
  # what a user waits for.
  with-upx-pack: true

download-options:
  prefer-binary: true
