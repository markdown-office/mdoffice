name: tests

on:
  # A push to a branch that also has a pull request analyses that branch a second
  # time, beside the analysis the pull request produces. SonarCloud keeps one
  # analysis per branch, so the later of the two replaces the earlier, and the
  # gate check of the first can no longer read its own analysis: it asks for the
  # status by analysis id, and the id of a replaced analysis is refused with a
  # 403. The push run and the pull request run of one branch therefore cannot
  # both be green, whichever order they finish in.
  #
  # So a push is analysed on `main`, where no pull request competes with it, and
  # a feature branch is analysed once — by its pull request.
  push:
    branches: [main]
    # A tag as well as a branch, so cutting a release runs the same suite `main`
    # does. Without this the tag is the one ref in the repository that is never
    # tested, and a release could be published from a commit whose suite is red —
    # the release workflow builds the binaries and does not test the library.
    tags: ['v*']
  # The analysis on the pull request, rather than the one on the push, is what
  # the check on the pull request is about: SonarCloud reports the pull request
  # against `refs/heads/<branch>`, so without this the check on the pull request
  # is the branch's last analysis rather than this pull request's, and a push
  # that lands after the last review is the one that gets judged. The scanner
  # reads the pull request from the event, so the trigger is the whole of the
  # difference — see the `projectBaseDir` note below for the other half.
  pull_request:
  # Every job resolves afresh rather than installing from a lock file, because the
  # manifest names the other two repositories by directory — see the setup action.
  # This job is the one that finds out when something they depend on has moved.
  schedule:
    - cron: '41 6 * * 1'

# One push does not need five runs; the last is enough.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Which branch of each library this repository is built against.
#
# `main` is the library as it is released, and it is the right answer for almost
# every run. A pull request that needs a library which is not on `main` yet —
# a call the library does not have, a class it does not carry — cannot be built
# against `main`, and saying so in the repository's settings is better than a
# build that fails on a name the library has not got yet.
#
# The variables are read at the point of use and default to `main` when they are
# not set, so nothing has to be done to them for an ordinary run, and setting
# them back to `main` — or removing them — puts the repository back as it was.
env:
  MARKDOWN_WORD_REF: ${{ vars.MARKDOWN_WORD_REF || 'main' }}
  MARKDOWN_PRESENTATION_REF: ${{ vars.MARKDOWN_PRESENTATION_REF || 'main' }}

jobs:
  # Every job begins by checking the repository out twice: once here, shallow, so that
  # `.github/actions/setup` is on disk; and once inside that action, beside the two
  # libraries it fetches. The manifest's `path` entries resolve by directory and
  # `../markdown-word` resolves only in that layout, so the second checkout is the
  # arrangement the manifest requires rather than a convenience.

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          word: ${{ env.MARKDOWN_WORD_REF }}
          presentation: ${{ env.MARKDOWN_PRESENTATION_REF }}
          php: '8.5'

      # Not `--strict`, which would fail on the `*` requirement for the two libraries
      # and nothing else — neither is published yet, so there is no version to bound.
      - name: Validate the manifest
        working-directory: mdoffice
        run: composer validate --no-check-publish

      # The one check that can only be made by running it: a launcher whose class moved,
      # or whose autoloader was pruned, exits non-zero here rather than in somebody's
      # terminal. It prints the two library versions too.
      - name: The command runs
        working-directory: mdoffice
        run: |
          php bin/mdoffice --version
          php bin/mdoffice word --version
          php bin/mdoffice slides --version

  test:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pest 5 needs PHP 8.4, so 8.2 is not here. It is checked by the minimum job
        # below, which proves the program works on the oldest version the manifest
        # claims rather than running a suite that cannot be installed there.
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          word: ${{ env.MARKDOWN_WORD_REF }}
          presentation: ${{ env.MARKDOWN_PRESENTATION_REF }}
          php: ${{ matrix.php }}
          coverage: pcov

      - name: Test
        working-directory: mdoffice
        run: vendor/bin/pest

  # The program on the oldest PHP it claims to support.
  #
  # Pest 5 needs 8.4, so the suite cannot run here. What can — and must — is proof
  # that the program converts in both directions and writes a deck: a version-specific
  # syntax error or a broken autoloader is exactly what this catches, and neither is
  # visible from a suite that never installs.
  minimum:
    name: php 8.2 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          word: ${{ env.MARKDOWN_WORD_REF }}
          presentation: ${{ env.MARKDOWN_PRESENTATION_REF }}
          php: '8.2'
          dev: 'false'

      # A conversion each way, and the deck, because the slides half pulls in
      # PHPPresentation and the Word half pulls in PHPWord and neither is otherwise
      # touched here. Every output is written under `$RUNNER_TEMP`: with no `-o` the
      # result lands beside the input, which for a checkout would be an untracked file
      # in the tree, so each one is named rather than derived.
      - name: Word to .docx and back
        working-directory: mdoffice
        run: |
          php bin/mdoffice word examples/01-smoke.md --to docx -o "$RUNNER_TEMP/smoke.docx"
          php bin/mdoffice word "$RUNNER_TEMP/smoke.docx" -o "$RUNNER_TEMP/smoke.md"
          test -s "$RUNNER_TEMP/smoke.md"

      - name: Markdown to a deck
        working-directory: mdoffice
        run: |
          php bin/mdoffice slides examples/02-deck.md -o "$RUNNER_TEMP/deck.pptx"
          test -s "$RUNNER_TEMP/deck.pptx"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          word: ${{ env.MARKDOWN_WORD_REF }}
          presentation: ${{ env.MARKDOWN_PRESENTATION_REF }}
          php: '8.5'
          coverage: pcov

      # 90 rather than 100: this is a dispatcher, and the converting belongs to the two
      # libraries, whose own gates are at 91 and 100. What is left here is the branch
      # that picks one and the error it prints for neither. Below the current figure
      # rather than at it, so the threshold can fail.
      - name: Coverage
        working-directory: mdoffice
        run: |
          vendor/bin/pest --coverage --min=90 \
            --coverage-clover=build/coverage/clover.xml \
            --log-junit build/coverage/junit.xml

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: mdoffice/build/coverage

  # Static analysis on SonarCloud, as its own job so a finding and a failing test are
  # two lines on a pull request rather than one red cross. It needs the test job to
  # have passed: analysing a commit whose suite does not run reports on code nobody
  # has checked.
  #
  # Not on a tag. SonarCloud analyses branches, a tag ref is not one, so the scan is
  # accepted and the gate check then refused with a 403 — red on every release for a
  # gate that already passed on the commit the tag points at.
  sonar:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: test
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
      && !startsWith(github.ref, 'refs/tags/')
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      # A missing token otherwise surfaces as an authentication failure several steps
      # later, which says nothing about what to do about it. This says it.
      - name: Is there a token?
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::SONAR_TOKEN is not set, so there is nothing to authenticate with."
          echo "::error::Create one at https://sonarcloud.io/account/security, then add it"
          echo "::error::under Settings -> Secrets and variables -> Actions."
          exit 1

      # A token that SonarCloud refuses surfaces as a bare 403 on
      # `/analysis/jres`, several steps into the scanner's own output, where it
      # reads like a problem with the code rather than with the credential.
      # Asking first says which of the two it is, and the answer names the
      # account the token belongs to, which is the thing that has to change.
      - name: Does SonarCloud accept the token?
        run: |
          code=$(curl -sS -o /tmp/sonar-user.json -w '%{http_code}' \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            https://sonarcloud.io/api/users/current || echo 000)

          if [ "${code}" = "000" ]; then
            echo "::error::SonarCloud could not be reached, so the analysis cannot run."
            echo "::error::This is not a statement about the token; it is a statement about the network."
            exit 1
          fi

          if [ "${code}" != "200" ]; then
            echo "::error::SonarCloud answered ${code} for this token, so it will analyse nothing."
            echo "::error::A token it refuses has been revoked, or belongs to an account that has"
            echo "::error::no access to the markdown-office organisation."
            echo "::error::Create one at https://sonarcloud.io/account/security under the account"
            echo "::error::that owns the organisation, then add it as the repository secret"
            echo "::error::SONAR_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          login=$(sed -n 's/.*"login":"\([^"]*\)".*/\1/p' /tmp/sonar-user.json)
          echo "the token belongs to ${login:-an account SonarCloud did not name}"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          word: ${{ env.MARKDOWN_WORD_REF }}
          presentation: ${{ env.MARKDOWN_PRESENTATION_REF }}
          php: '8.5'
          coverage: pcov
          history: 0

      # Both reports the analysis reads, produced in one run. The HTML report is
      # skipped; Sonar wants the machine-readable one.
      - name: Coverage and test results for the analysis
        working-directory: mdoffice
        run: |
          vendor/bin/pest --coverage --min=90 \
            --coverage-clover=build/coverage/clover.xml \
            --log-junit build/coverage/junit.xml

      # `projectBaseDir`, and the two Sonar actions spell the directory differently.
      # Neither takes `working-directory:` on the step — GitHub refuses to parse a
      # workflow that puts that key on a step with `uses:` — and neither accepts the
      # other's name either, which warns rather than fails, so the scan read the
      # bootstrap checkout at the workspace root and none of this project's settings.
      - name: Analyse
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8
        with:
          projectBaseDir: mdoffice

      # Where the scan above recorded which task to wait for. Without it this looks
      # for the file under the workspace root, finds none, and fails without a reason.
      - name: Quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        with:
          scanMetadataReportFile: mdoffice/.scannerwork/report-task.txt
