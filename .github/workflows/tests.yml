name: tests

on:
  push:
    branches: [main]
    # A tag as well as a branch, so cutting a release runs the same suite `main`
    # does. Without this the tag is the one ref in the repository that is never
    # tested, and a release could be published from a commit whose suite is red.
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # This repository commits its lock file, which is what makes it an application
  # rather than a library: the version of every dependency a released archive holds
  # is a decision somebody made rather than whatever resolved that morning. So the
  # jobs below install from the lock.
  #
  # One job runs without it, to find out when the lock has gone out of date with the
  # manifest — a library requirement renamed upstream is invisible to `composer
  # install` until the next `composer update`, and the lock is what the suite runs
  # against.
  schedule:
    - cron: '41 6 * * 1'

# One push does not need four runs; the last is enough.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # A manifest that does not validate is not worth running anything else
      # against.
      #
      # Not `--strict`: this manifest requires both libraries as `*`, which Composer
      # warns about, and that is the state the README sets out — neither is published
      # under its `markdown-office` name yet, so there is no released version to bound
      # against. `--strict` would fail on that warning and nothing else, which reads as
      # a broken manifest rather than as the known one. `tests/Unit/console.php` fails
      # when the lock stops agreeing with the manifest, which is the part that is a
      # defect rather than a decision.
      - name: Validate the manifest
        run: composer validate --no-check-publish

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      # The binary answering for itself, which is the one check that can only be made
      # by running it: a launcher whose class moved, or whose autoloader was pruned,
      # exits non-zero here rather than in somebody's terminal.
      - name: The command runs
        run: php bin/mdoffice --version

  test:
    name: php ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pest 5 needs PHP 8.4, so 8.2 is not here. It is checked by the minimum job
        # below, which proves the program works on the oldest version the manifest
        # claims rather than running a suite that cannot be installed there.
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          # pcov rather than xdebug: it is roughly an order of magnitude faster.
          coverage: pcov
          tools: composer:v2

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Test
        run: vendor/bin/pest

  # The program on the oldest PHP it claims to support.
  #
  # Pest 5 needs 8.4, so the suite cannot run here. What can — and must — is proof
  # that the program converts in both directions and writes a deck: a version-specific
  # syntax error or a broken autoloader is exactly what this catches, and neither is
  # visible from a suite that never installs.
  minimum:
    name: php 8.2 (minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev

      - name: Versions
        run: php bin/mdoffice --version

      # A conversion each way, and the deck, because the slides half pulls in
      # PHPPresentation and the Word half pulls in PHPWord and neither is otherwise
      # touched here. Every output is written under `$RUNNER_TEMP`: with no `-o` the
      # result lands beside the input, which for a checkout would be an untracked file
      # in the tree, so each one is named rather than derived.
      - name: Word to .docx and back
        run: |
          php bin/mdoffice word examples/01-smoke.md --to docx -o "$RUNNER_TEMP/smoke.docx"
          php bin/mdoffice word "$RUNNER_TEMP/smoke.docx" -o "$RUNNER_TEMP/smoke.md"
          test -s "$RUNNER_TEMP/smoke.md"

      - name: Markdown to a deck
        run: |
          php bin/mdoffice slides examples/02-deck.md -o "$RUNNER_TEMP/deck.pptx"
          test -s "$RUNNER_TEMP/deck.pptx"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      # 90 rather than 100. This is a dispatcher: the converting belongs to the two
      # libraries, whose own gates are at 91 and 100, so what is measured here is the
      # part that decides which library runs and writes the result. It is not 100
      # because what is left is a person-facing error message and the catch-all branch
      # behind it, and those are the lines a gate should not push somebody to write a
      # contrived test for.
      #
      # Below the current figure rather than at it, so that it is a gate: a threshold
      # the code already meets fails the first pull request that adds an uncovered
      # line, which trains people to raise the number instead of writing the test.
      #
      # `--min=90` is the same number the analysis job below runs, rather than a
      # second threshold of its own.
      - name: Coverage
        run: |
          vendor/bin/pest --coverage --min=90 \
            --coverage-clover=build/coverage/clover.xml \
            --log-junit build/coverage/junit.xml

      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2 # v4
        with:
          name: coverage
          path: build/coverage

  # Static analysis on SonarCloud.
  #
  # Its own job rather than a step in the test matrix, so that a finding and a
  # failing test are two different lines on a pull request instead of one red cross.
  # It needs the test job to have passed: analysing a commit whose suite does not run
  # would report on code nobody has checked.
  #
  # Not on a tag. SonarCloud analyses branches, and a tag ref is not one, so the scan
  # is accepted and then the gate check is refused with a 403 — a red run on every
  # release for a gate that already passed on the commit the tag points at.
  sonar:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: test
    if: >-
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
      && !startsWith(github.ref, 'refs/tags/')
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      # A missing token otherwise surfaces as an authentication failure several steps
      # later, which says nothing about what to do about it. This says it.
      - name: Is there a token?
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::error::SONAR_TOKEN is not set, so there is nothing to authenticate with."
          echo "::error::Create one at https://sonarcloud.io/account/security, then add it"
          echo "::error::under Settings -> Secrets and variables -> Actions."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarCloud needs the full history to attribute new code, which a shallow
          # clone would not have.
          fetch-depth: 0

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          # pcov rather than xdebug: the suite runs once more here, and xdebug is
          # roughly an order of magnitude slower.
          coverage: pcov
          tools: composer:v2

      - name: Install
        run: composer install --prefer-dist --no-interaction --no-progress

      # Both reports the analysis reads, produced in one run. The HTML report is
      # skipped; Sonar wants the machine-readable one.
      - name: Coverage and test results for the analysis
        run: |
          vendor/bin/pest --coverage --min=90 \
            --coverage-clover=build/coverage/clover.xml \
            --log-junit build/coverage/junit.xml

      - name: Analyse
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8

      # Fails the pull request when the quality gate is red, which is the whole point
      # of running the analysis here rather than letting SonarCloud do it on the side.
      - name: Quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1