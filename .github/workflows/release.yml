name: release

on:
  push:
    tags: ['v*']
  # The binaries can be built without a release, which is how the Windows build is
  # checked before there is a tag to publish it under. The `release` job below only
  # runs for a tag.
  workflow_dispatch:

# Read-only by default. The job below widens this to `contents: write`.
permissions:
  contents: read

jobs:
  # The PHAR is built once and reused by all three platforms, so that the archive
  # inside every released binary is the same file as the released archive. That is the
  # only reproducibility claim this pipeline makes: a compiled static PHP is not
  # reproducible, and no amount of checking makes it so.
  phar:
    name: build the phar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mdoffice
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup
        with:
          php: '8.4'

      # The archive says when it was built, and the whole point of that is that the
      # answer is the commit rather than the runner. `SOURCE_DATE_EPOCH` is what
      # `tools/build-phar.php` stamps every entry with, and the commit's own date is
      # the most meaningful instant a build could be given.
      - name: Stamp the archive with the commit's date
        run: echo "SOURCE_DATE_EPOCH=$(git -C mdoffice log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: composer build:phar

      # Built twice and compared, because a build that says it is reproducible and is
      # not is worse than one that says nothing: the checksum in the release notes is a
      # claim about the artifact, and this is where the claim is checked. The two builds
      # share a runner, a PHP and a zlib, so what this proves is that the build script
      # introduces nothing of its own.
      - name: The build is reproducible
        run: |
          first=$(sha256sum build/mdoffice.phar | cut -d' ' -f1)
          composer build:phar
          second=$(sha256sum build/mdoffice.phar | cut -d' ' -f1)
          echo "first  $first"
          echo "second $second"
          if [ "$first" != "$second" ]; then
            echo "::error::Two builds of the same commit produced different bytes."
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdoffice-phar
          path: mdoffice/build/mdoffice.phar
          if-no-files-found: error
          retention-days: 30

  # One static executable per platform, each built by the runner that will also run
  # it, so that a binary which does not work on its own platform is found here rather
  # than by whoever downloads it.
  #
  # Two ways to get an interpreter, because upstream publishes them unevenly. Linux
  # and macOS take the `micro` build upstream publishes, pinned by its checksum.
  # Windows has no published build, so the interpreter is compiled there, from a
  # pinned commit of the tool that compiles it.
  binary:
    name: ${{ matrix.target }}
    needs: phar
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-15
            runtime: prebuilt
            platform: macos-aarch64
            php-version: '8.4.27'
            sha256: bbbdd39c20f0daad7cb1586b0685c8f3d48d0398b4b212f35f84a7d556aeb57a
            imagick: 'yes'
            executable: mdoffice-macos-arm64
          - target: macos-x86_64
            os: macos-15-intel
            runtime: prebuilt
            platform: macos-x86_64
            php-version: '8.4.27'
            sha256: daf600f715ef78b5bae676cf8c694af064308750a2fd2901abe546b7c7655f85
            imagick: 'yes'
            executable: mdoffice-macos-x86_64
          - target: linux-x86_64
            os: ubuntu-24.04
            runtime: prebuilt
            platform: linux-x86_64
            php-version: '8.4.27'
            sha256: e93dbf477cffe4f798e421c81cd8ebcc68b8eaa7d9b7fb4e8df019c47d660ce0
            imagick: 'yes'
            executable: mdoffice-linux-x86_64
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            runtime: prebuilt
            platform: linux-aarch64
            php-version: '8.4.27'
            sha256: 6d8f516df697d2c47a9e8351b6057de99583e80262a43444b31443ace3448ca2
            imagick: 'yes'
            executable: mdoffice-linux-aarch64
          - target: windows-x64
            os: windows-2022
            runtime: compiled
            craft: craft-windows.yml
            imagick: 'no'
            executable: mdoffice-windows-x64.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The archive comes from the job that built it rather than being rebuilt here,
      # so the bytes that are shipped are the bytes that were checked.
      #
      # This job does not use `.github/actions/setup`, which checks this repository
      # out into a directory beside the two libraries it needs: the archive is built
      # there and comes from there, and nothing else here wants them.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mdoffice-phar
          path: build

      # The PHP that reads the smoke test, and the PHP the compiler runs under. The
      # runner's own PHP is only the one that reads the test.
      #
      # Not on the Intel runner: the action does not come back there. It hangs for
      # half an hour and then says it could not set PHP up, and the job fails before
      # it has built anything. The image carries a PHP of its own, and the smoke
      # test needs nothing of it but to be read — the interpreter that runs the
      # binary is the one the release publishes either way. The step below says
      # which PHP reads the test, so the log does not leave it open.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: matrix.os != 'macos-15-intel'
        with:
          php-version: '8.4'
          coverage: none

      - name: The PHP that reads the smoke test
        run: php --version

      # Upstream publishes a `micro` build per platform and per PHP version, and a
      # checksum beside it. The checksum in the matrix is the pin: the download has
      # to be that file and no other, so a release says which interpreter it holds
      # rather than which one was published that morning.
      #
      # Upstream's own checksum is read as well, so the two cannot drift apart
      # unnoticed. It is the number to put in the matrix when the pin moves, which
      # is what the error message says when they do.
      #
      # The PHP version is part of the file's name, but the version is not what
      # identifies the file: upstream rebuilt `8.4.27` for all four platforms
      # without changing the version, so the same name holds different bytes than
      # it held a week earlier. The pin is therefore a pin on a build rather than on
      # a version, and it has to be moved by hand when upstream rebuilds one. What
      # it buys is that the change is noticed rather than absorbed: the build stops
      # and says which bytes it found and which it expected.
      - name: Fetch the published interpreter
        if: matrix.runtime == 'prebuilt'
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ matrix.php-version }}
        run: |
          # `sha256sum` is not on a macOS runner and `shasum` is not on a Linux one
          # by the same name, so the digest is taken by whichever is there.
          digest() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          name="php-${VERSION}-micro-${PLATFORM}.tar.gz"
          base="https://dl.static-php.dev/v3/php-bin/bulk"
          curl -fsSL -o runtime.tar.gz "${base}/${name}"
          actual="$(digest runtime.tar.gz)"
          echo "pinned    ${{ matrix.sha256 }}"
          echo "download $actual"
          if [ "$actual" != "${{ matrix.sha256 }}" ]; then
            echo "::error::The published interpreter is not the one this pipeline pins."
            exit 1
          fi
          curl -fsSL -o runtime.sha256 "${base}/${name}.sha256"
          upstream="$(awk '{print $1}' runtime.sha256)"
          if [ "$upstream" != "${{ matrix.sha256 }}" ]; then
            echo "::error::Upstream publishes $upstream for ${name}; this pipeline pins ${{ matrix.sha256 }}."
            echo "::error::Replace the sha256 in the matrix with that number to move the pin."
            exit 1
          fi
          tar xzf runtime.tar.gz
          mv micro.sfx runtime
          ls -la runtime

      # The macOS executables are signed by the interpreter they are made from, and
      # the signature is what an arm64 Mac needs: an unsigned arm64 binary is killed
      # by the kernel before Gatekeeper is ever asked.
      #
      # The signature cannot be moved. `codesign` refuses to sign a file with a
      # payload appended to it — the appended bytes are past the end of the code, and
      # the check it makes is on the file — so the interpreter's own signature is
      # what the executable keeps, and it is checked here rather than after the
      # fact. A published interpreter without one fails the build instead of
      # producing an executable the kernel would kill.
      - name: The interpreter is signed
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --verbose=2 runtime

      # The tool that compiles the interpreter, at a commit rather than at a
      # download. Upstream publishes no release of the v3 line — the last release is
      # the v2 line, whose build configuration is a different one — and the build it
      # does publish rotates several times a day, so a checksum of it would be a
      # checksum of a file nobody chose.
      #
      # A commit is a file nobody has to refresh: the checkout is the commit, and
      # the tool that reads it is the tool that commit contains.
      - name: Fetch the compiler
        if: matrix.runtime == 'compiled'
        shell: bash
        env:
          COMMIT: d7f1a88dad6d78fefa76b249b05dab1ddcff364b
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/crazywhalecc/static-php-cli.git spc
          git -C spc fetch --depth 1 origin "$COMMIT"
          git -C spc checkout "$COMMIT"
          composer install --no-dev --no-interaction --no-progress --working-dir=spc
          php spc/bin/spc --version

      # The build's own diagnosis of the machine, and its own fix for what it can
      # fix. Without it the compile fails on a missing `bison` or `pkg-config` rather
      # than on anything to do with this project.
      - name: Prepare the build environment
        if: matrix.runtime == 'compiled'
        shell: bash
        run: php spc/bin/spc doctor --auto-fix

      # The build itself. The craft file is the one platform's, because Windows is
      # the only platform that compiles here; the other three take the published
      # interpreter. `tests/Unit/craft.php` holds it and fails when it stops
      # carrying what the libraries ask for.
      - name: Build the static interpreter
        if: matrix.runtime == 'compiled'
        shell: bash
        run: php spc/bin/spc craft "${{ matrix.craft }}"

      # The archive and the interpreter become one file: the interpreter with the
      # archive appended, which is what `micro.sfx` reads.
      #
      # The name it is given carries no version, because the release job renames it:
      # the version is the tag's, and the tag is known here too, but a name that
      # carried it would have to be built twice if the tag were ever wrong.
      - name: Combine the archive with the interpreter
        shell: bash
        run: |
          if [ "${{ matrix.runtime }}" = "compiled" ]; then
            php spc/bin/spc micro:combine build/mdoffice.phar -O mdoffice
          else
            cat runtime build/mdoffice.phar > mdoffice
          fi
          if [ -f mdoffice.exe ]; then
            mv mdoffice.exe "${{ matrix.executable }}"
          else
            mv mdoffice "${{ matrix.executable }}"
          fi
          # `cat` writes a new file, and a new file is not runnable: the mode of
          # the interpreter is not carried over to what is written from it. The
          # file has to be made runnable here, because the smoke test below runs
          # it and the published binary is this one.
          chmod +x "${{ matrix.executable }}"
          ls -la "${{ matrix.executable }}"

      # The same interpreter, with a file that asks it what it ended up with
      # appended to it. The released binary cannot be asked: it runs one program and
      # stops, and the only PHP it will run is the archive's own entry point.
      #
      # On Windows the interpreter is a program the kernel will only start with an
      # `.exe` on its name, so the probe gets one.
      - name: Build the probe
        shell: bash
        run: |
          if [ "${{ matrix.runtime }}" = "compiled" ]; then
            interpreter=buildroot/bin/micro.sfx
          else
            interpreter=runtime
          fi
          if [ "${{ runner.os }}" = "Windows" ]; then
            cat "$interpreter" tools/extension-probe.php > probe.exe
          else
            cat "$interpreter" tools/extension-probe.php > probe
          fi
          chmod +x probe*
          ls -la probe*

      # The artifact is what is tested, not the source it was built from. A static
      # build fails in ways a test suite never sees: an extension the code needs is
      # missing from the compile, the archive is not attached to the interpreter the
      # way it was meant to be, or the binary is one the kernel refuses to start.
      - name: The binary works
        shell: bash
        run: |
          php tools/smoke-binary.php \
            --binary "${{ matrix.executable }}" \
            --probe "./probe${{ runner.os == 'Windows' && '.exe' || '' }}" \
            --root . \
            --imagick "${{ matrix.imagick }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mdoffice-${{ matrix.target }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish the release
    needs: [phar, binary]
    # A manual run builds the binaries and stops there. Publishing needs a tag,
    # because the release is named after it and its notes come from the changelog.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # Creating a release needs `contents: write`, and the workflow-level grant is only
    # read. The grant belongs here, on the one job that writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Packagist reads the tag, not the release, so a tag that disagrees with the
      # changelog still installs — as a version whose notes are the previous release's.
      # The changelog is the only place a version is written down, so it is what the
      # tag is checked against.
      - name: The tag and the changelog must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          released="$(sed -n 's/^## \[\([^]]*\)\].*/\1/p' CHANGELOG.md | grep -v '^Unreleased$' | head -1)"
          echo "tag      $tag"
          echo "changelog $released"
          if [ "$tag" != "$released" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but the newest released heading in CHANGELOG.md is [$released]."
            echo "::error::Move the [Unreleased] section to ## [$tag] with today's date, add the"
            echo "::error::link reference at the bottom, commit, and tag that commit."
            exit 1
          fi

      # Taken from the changelog rather than from the tag's commit message, so the notes
      # on the release are the same text `composer` and the repository agree on. Stops
      # at the next heading, and at the link references after the last section, which
      # are not part of any release.
      - name: Release notes from the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          mkdir -p build
          awk -v want="$tag" '
            $0 ~ "^## \\[" want "\\]" { body = 1; next }
            body && /^## \[/ { exit }
            body && /^\[/ { exit }
            body { print }
          ' CHANGELOG.md > build/notes.md
          # An empty body publishes a release with nothing on it, and Packagist shows
          # those notes next to the version. Fail here rather than after the tag exists.
          if [ ! -s build/notes.md ]; then
            echo "::error::CHANGELOG.md has no body under ## [$tag]."
            exit 1
          fi
          echo "--- build/notes.md ---"
          cat build/notes.md

      # Every artifact this workflow builds, in one place. The pattern is the one
      # the `binary` job names its artifacts after, and the archive is among them.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mdoffice-*
          path: build/release
          merge-multiple: true

      # The names carry the version, because a release page is a list of files and a
      # file called `mdoffice-macos-arm64` says nothing about which version it is. The
      # Homebrew formula and the winget manifest both address the assets by these
      # names.
      - name: Name the assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd build/release
          for file in mdoffice-*; do
            extension=""
            name="$file"
            case "$file" in
              *.exe) extension=".exe"; name="${file%.exe}" ;;
            esac
            mv "$file" "mdoffice-$version-${name#mdoffice-}$extension"
          done
          # The archive is named after the loop rather than before it: the loop's
          # pattern is the executables', and a file named after the version would be
          # one of them.
          mv mdoffice.phar "mdoffice-$version.phar"
          ls -la

      # The artifact store does not keep the mode of a file: everything comes
      # back 0644, whatever it was uploaded with. The binaries are made runnable
      # here, so that a user who downloads one and runs it does not have to make
      # it runnable first.
      - name: Make the binaries runnable
        run: |
          cd build/release
          for file in mdoffice-*-macos-* mdoffice-*-linux-*
          do
            [ -f "${file}" ] && chmod +x "${file}"
          done
          ls -la

      # The checksums, over every file in the release. A user who downloads the
      # binary can check it against this, and the formula and the manifest read the
      # same numbers.
      - name: The checksums
        run: |
          cd build/release
          sha256sum mdoffice-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: build/notes.md
          fail_on_unmatched_files: true
          files: build/release/*
