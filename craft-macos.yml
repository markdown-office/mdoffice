# static-php-cli's build configuration for the macOS executable.
#
# `spc craft <file>` builds what this file says; there is no default, because the
# three platforms do not build the same thing. The differences are two, and they are
# the only two:
#
#   - `imagick` is in the extension list here and in the Linux one, and not in the
#     Windows one, because static-php-cli cannot build it there: ImageMagick's own
#     Windows build uses a 64-channel bit mask that needs a C++ compiler, and the
#     upstream tool does not patch that. A Windows binary therefore has no SVG
#     support, and both libraries say so with an actionable message rather than
#     failing quietly. The pipeline asserts the absence there on purpose, so a build
#     that silently gained it would be noticed.
#
#   - `with-upx-pack` is absent here and set in the other two, because UPX does not
#     support Mach-O. The macOS binary is therefore the largest of the three, and
#     the release notes say so rather than letting somebody file it as a bug.
#
# `tests/Unit/craft.php` holds the three side by side and fails when a difference
# appears that is not one of those two.
#
# The SAPI set and the extension list were settled by building one on an Apple
# Silicon Mac and running it, rather than by reading the documentation:
#   - `cli` is what builds it, `micro` is what turns it into an executable. The
#     `cli` one is kept because the smoke test asks the interpreter which
#     extensions it ended up with, and only the interpreter can answer.
#   - `prefer-binary` takes the dependency libraries prebuilt rather than
#     compiling each from source, which is the difference between a few minutes and
#     most of an afternoon. The PHP itself is still compiled.
#   - `gd` without `with-libs` has **no JPEG**, which would break most real images.
#     See `craft-gd.md`.

php-version: '8.4'

extensions: "dom,simplexml,xml,xmlwriter,gd,zip,mbstring,phar,iconv,tokenizer,filter,ctype,imagick"

sapi:
  - cli
  - micro

build-options:
  # The graphics libraries `gd` is built against. Without them the extension has no
  # JPEG support at all — the functions are not even compiled in — so a build that
  # passes `composer check-platform-reqs` would still refuse a photograph.
  with-libs: "freetype,libjpeg,libavif,libwebp"

download-options:
  prefer-binary: true
