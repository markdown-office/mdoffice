# static-php-cli's build configuration for the static executables.
#
# Run from the repository root: `spc craft` reads this file from the working
# directory, and `micro:combine` is then run against the PHAR it produced.
#
# The SAPI set and the extension list were settled by building one on an Apple
# Silicon Mac and running it, rather than by reading the documentation:
#   - `cli` is what builds it, `micro` is what turns it into an executable.
#   - `prefer-pre-built` takes the dependency libraries prebuilt rather than
#     compiling each from source, which is the difference between a few minutes and
#     most of an afternoon. The PHP itself is still compiled.
#   - `gd` without `--with-libs` has **no JPEG**, which would break most real
#     images. See `craft-gd.md` for the extension list this has to be built with.

php-version: '8.4'

extensions: "dom,simplexml,xml,xmlwriter,gd,zip,mbstring,phar,iconv,tokenizer,filter,ctype"

# `imagick` belongs here on Linux and macOS and **not** on Windows, where
# static-php-cli cannot build it: ImageMagick's own Windows build uses a 64-channel
# bit mask that needs a C++ compiler, and the upstream tool does not patch that.
# A Windows binary therefore has no SVG support, and both libraries say so with an
# actionable message rather than failing quietly. The pipeline asserts the absence
# there on purpose, so a build that silently gained it would be noticed.

sapi:
  - cli
  - micro

download-options:
  prefer-pre-built: true